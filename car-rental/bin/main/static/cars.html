<!DOCTYPE html>
<html>
<head>
    <title>Cars - Car Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">🚗 Available Cars</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Car Name</th>
                <th>Model</th>
                <th>Price/Day</th>
                <th>Available</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody id="carTable"></tbody>
    </table>

    <script>
        fetch("/api/cars")
            .then(res => res.json())
            .then(data => {
                let rows = "";
                data.forEach(car => {
                    rows += `
                        <tr>
                            <td>${car.name}</td>
                            <td>${car.model}</td>
                            <td>₹${car.pricePerDay}</td>
                            <td>${car.available ? "✅ Yes" : "❌ No"}</td>
                            <td><img src="${car.imageUrl}" width="120"></td>
                        </tr>`;
                });
                document.getElementById("carTable").innerHTML = rows;
            });
    </script>
</body>
</html>
